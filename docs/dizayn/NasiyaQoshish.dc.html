<html lang="uz">
<head>

</head>
<body>
<x-dc>
<helmet>

body{margin:0}
a{color:#1B4FE0}a:hover{color:#2F6BFF}

</style>
</helmet>
<div style="width: 720px; height: 1000px; box-sizing: border-box; padding: 32px; display: flex; align-items: center; justify-content: center; font-family: Inter, 'Segoe UI', system-ui, sans-serif; color: #0B1530; background: linear-gradient(rgba(237,241,251,0.55), rgba(237,241,251,0.55)), radial-gradient(520px 420px at 0% 0%, rgba(104,160,255,0.55), rgba(104,160,255,0) 70%), radial-gradient(480px 420px at 100% 10%, rgba(176,142,255,0.50), rgba(176,142,255,0) 70%), radial-gradient(560px 460px at 80% 100%, rgba(72,214,206,0.46), rgba(72,214,206,0) 70%), radial-gradient(420px 360px at 0% 100%, rgba(255,190,120,0.30), rgba(255,190,120,0) 70%), #F2F6FF;">
  <section role="dialog" aria-modal="true" aria-labelledby="d-s" style="width: 100%; max-width: 600px; box-sizing: border-box; padding: 28px 30px; display: flex; flex-direction: column; gap: 16px; background: rgba(250,251,255,0.95); border: 1px solid rgba(255,255,255,0.95); border-radius: 32px; box-shadow: 0 30px 80px rgba(20,40,90,0.30), 0 2px 6px rgba(20,40,90,0.12);">

    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="width: 44px; height: 44px; flex: none; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: #FFE9DA; color: #C2410C;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z M5 19.5A1.5 1.5 0 0 0 6.5 21H19 M9 7h6 M9 11h6"></path></svg>
      </span>
      <div style="flex: 1; min-width: 0;">
        <h2 id="d-s" style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.3px;">Nasiya yozish</h2>
        <span style="font-size: 13px; color: #4F607D;">Smena #42 · Alisher Karimov</span>
      </div>
      <a href="Main.dc.html" aria-label="Yopish" style="width: 44px; height: 44px; flex: none; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: #2E3D5C; text-decoration: none; background: rgba(20,40,80,0.06);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <label for="ism-k" style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #4F607D;">Mijoz ismi</label>
      <input id="ism-k" type="text" autocomplete="off" placeholder="Ism va familiya" value="{{ ism }}" onChange="{{ ismOzgar }}" style="width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 18px; border-radius: 23px; font: inherit; font-size: 15px; color: #0B1530; background: linear-gradient(180deg, #FFFFFF, rgba(255,255,255,0.75)); border: 1px solid #C9D1DE; outline: none;">
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px;">
      <div style="display: flex; flex-direction: column; gap: 7px; min-width: 0;">
        <label for="tel-k" style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #4F607D;">Telefon</label>
        <input id="tel-k" type="tel" autocomplete="off" placeholder="+998 __ ___ __ __" value="{{ tel }}" onChange="{{ telOzgar }}" style="width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 18px; border-radius: 23px; font: inherit; font-size: 15px; font-variant-numeric: tabular-nums; color: #0B1530; background: linear-gradient(180deg, #FFFFFF, rgba(255,255,255,0.75)); border: 1px solid #C9D1DE; outline: none;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 7px; min-width: 0;">
        <label for="raqam-k" style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #4F607D;">Mashina raqami</label>
        <input id="raqam-k" type="text" autocomplete="off" placeholder="01 A 123 BC" value="{{ raqam }}" onChange="{{ raqamOzgar }}" style="width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 16px; border-radius: 10px; font: inherit; font-size: 17px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #0B1530; background: #FFFFFF; border: 2px solid #0B1530; outline: none;">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <label for="summa-k" style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #4F607D;">Qarz summasi, so'm</label>
      <input id="summa-k" type="text" inputmode="numeric" autocomplete="off" placeholder="0" value="{{ summa }}" onChange="{{ summaOzgar }}" style="width: 100%; box-sizing: border-box; min-height: 60px; padding: 0 22px; border-radius: 30px; font: inherit; font-size: 26px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; color: #0B1530; background: linear-gradient(180deg, #FFFFFF, rgba(255,255,255,0.75)); border: 1px solid #C9D1DE; outline: none;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span id="muddat-l" style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #4F607D;">Qaytarish muddati</span>
      <div role="group" aria-labelledby="muddat-l" style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{ muddatlar }}" as="m" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{ m.bosilgan }}" onClick="{{ m.tanla }}" style="{{ m.uslub }}">{{ m.nomi }}</button>
        </sc-for>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
        <label for="sana-k" style="font-size: 13px; font-weight: 600; color: #2E3D5C;">Sana</label>
        <input id="sana-k" type="date" value="{{ sana }}" onChange="{{ sanaOzgar }}" style="flex: 1 1 180px; min-width: 0; box-sizing: border-box; min-height: 46px; padding: 0 16px; border-radius: 23px; font: inherit; font-size: 15px; color: #0B1530; background: linear-gradient(180deg, #FFFFFF, rgba(255,255,255,0.75)); border: 1px solid #C9D1DE; outline: none;">
        <span style="padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #DCE6FF; color: #1B4FE0; white-space: nowrap;">{{ muddatIzoh }}</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <label for="izoh-k" style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #4F607D;">Izoh</label>
      <textarea id="izoh-k" rows="2" placeholder="Masalan: hafta oxirida to'laydi" value="{{ izoh }}" onChange="{{ izohOzgar }}" style="width: 100%; box-sizing: border-box; min-height: 72px; padding: 12px 18px; border-radius: 20px; font: inherit; font-size: 15px; line-height: 1.4; color: #0B1530; resize: vertical; background: linear-gradient(180deg, #FFFFFF, rgba(255,255,255,0.75)); border: 1px solid #C9D1DE; outline: none;"></textarea>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #E9F0FF; color: #1B3A8A; font-size: 13px; line-height: 1.45;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px;"><path d="M12 21a9 9 0 1 0 0-18a9 9 0 0 0 0 18z M12 11v5 M12 8h.01"></path></svg>
      <span>Nasiya smena jadvalida "Nasiya" qatoriga qo'shiladi va kassada bo'lishi kerak bo'lgan naqddan ayiriladi.</span>
    </div>

    <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding-top: 2px;">
      <a href="Main.dc.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 22px; box-sizing: border-box; border-radius: 999px; font-size: 14px; font-weight: 700; color: #0B1530; text-decoration: none; background: linear-gradient(180deg, #FFFFFF, rgba(255,255,255,0.7)); border: 1px solid rgba(20,40,80,0.12); box-shadow: 0 6px 18px rgba(28,54,110,0.10);">Bekor qilish</a>
      <a href="Main.dc.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 24px; box-sizing: border-box; border-radius: 999px; font-size: 14px; font-weight: 700; color: #FFFFFF; text-decoration: none; background: linear-gradient(180deg, #6A98FF 0%, #2F6BFF 55%, #1F55E6 100%); border: 1px solid rgba(255,255,255,0.55); box-shadow: 0 10px 24px rgba(47,107,255,0.32), inset 0 1px 0 rgba(255,255,255,0.55);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
        Saqlash
      </a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var tanlangan = s.muddat !== undefined ? s.muddat : 1;
    var variantlar = [
      { nomi: "3 kun", sana: "2026-10-07", izoh: "07.10 gacha · 3 kun" },
      { nomi: "1 hafta", sana: "2026-10-11", izoh: "11.10 gacha · 7 kun" },
      { nomi: "2 hafta", sana: "2026-10-18", izoh: "18.10 gacha · 14 kun" },
      { nomi: "1 oy", sana: "2026-11-04", izoh: "04.11 gacha · 31 kun" }
    ];
    var asos = "min-height: 44px; padding: 0 18px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;";
    var faol = asos + " color: #FFFFFF; background: linear-gradient(180deg, #6A98FF 0%, #2F6BFF 55%, #1F55E6 100%); border: 1px solid rgba(255,255,255,0.55); box-shadow: 0 6px 14px rgba(47,107,255,0.28);";
    var oddiy = asos + " color: #2E3D5C; background: linear-gradient(180deg, #FFFFFF, rgba(255,255,255,0.7)); border: 1px solid rgba(20,40,80,0.12);";
    var muddatlar = variantlar.map(function (v, i) {
      return {
        nomi: v.nomi,
        bosilgan: i === tanlangan ? "true" : "false",
        uslub: i === tanlangan ? faol : oddiy,
        tanla: function () { self.setState({ muddat: i, sana: v.sana }); }
      };
    });
    var sana = s.sana !== undefined ? s.sana : variantlar[1].sana;
    var izohMuddat = tanlangan >= 0 && variantlar[tanlangan] && variantlar[tanlangan].sana === sana ? variantlar[tanlangan].izoh : "Boshqa sana";
    return {
      muddatlar: muddatlar,
      sana: sana,
      muddatIzoh: izohMuddat,
      ism: s.ism !== undefined ? s.ism : "Jasur To'xtayev",
      tel: s.tel !== undefined ? s.tel : "+998 90 123 45 67",
      raqam: s.raqam !== undefined ? s.raqam : "01 A 777 BC",
      summa: s.summa !== undefined ? s.summa : "350 000",
      izoh: s.izoh !== undefined ? s.izoh : "Damas, hafta oxirida to'laydi",
      ismOzgar: function (e) { self.setState({ ism: e.target.value }); },
      telOzgar: function (e) { self.setState({ tel: e.target.value }); },
      raqamOzgar: function (e) { self.setState({ raqam: e.target.value }); },
      summaOzgar: function (e) { self.setState({ summa: e.target.value }); },
      izohOzgar: function (e) { self.setState({ izoh: e.target.value }); },
      sanaOzgar: function (e) { self.setState({ sana: e.target.value, muddat: -1 }); }
    };
  }
}
</script>
</body>
</html>
