<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Xarajat yozish</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1B4FE0}a:hover{color:#2F6BFF}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #2F6BFF;outline-offset:2px}
input::placeholder{color:#7A879E}
</style>
</helmet>
<div style="width: 720px; height: 840px; box-sizing: border-box; padding: 32px; display: flex; align-items: center; justify-content: center; font-family: Inter, 'Segoe UI', system-ui, sans-serif; color: #0B1530; background: linear-gradient(rgba(237,241,251,0.55), rgba(237,241,251,0.55)), radial-gradient(520px 420px at 0% 0%, rgba(104,160,255,0.55), rgba(104,160,255,0) 70%), radial-gradient(480px 420px at 100% 10%, rgba(176,142,255,0.50), rgba(176,142,255,0) 70%), radial-gradient(560px 460px at 80% 100%, rgba(72,214,206,0.46), rgba(72,214,206,0) 70%), radial-gradient(420px 360px at 0% 100%, rgba(255,190,120,0.30), rgba(255,190,120,0) 70%), #F2F6FF;">
  <section role="dialog" aria-modal="true" aria-labelledby="d-s" style="width: 100%; max-width: 600px; box-sizing: border-box; padding: 28px 30px; display: flex; flex-direction: column; gap: 16px; background: rgba(250,251,255,0.95); border: 1px solid rgba(255,255,255,0.95); border-radius: 32px; box-shadow: 0 30px 80px rgba(20,40,90,0.30), 0 2px 6px rgba(20,40,90,0.12);">

    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="width: 44px; height: 44px; flex: none; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: #FFF1D6; color: #8A5A00;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z M9 8h6 M9 12h6 M9 16h3"></path></svg>
      </span>
      <div style="flex: 1; min-width: 0;">
        <h2 id="d-s" style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.3px;">Xarajat yozish</h2>
        <span style="font-size: 13px; color: #4F607D;">Smena #42 · boshliq aytgan to'lov</span>
      </div>
      <a href="Main.dc.html" aria-label="Yopish" style="width: 44px; height: 44px; flex: none; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: #2E3D5C; text-decoration: none; background: rgba(20,40,80,0.06);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <label for="summa-k" style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #4F607D;">Summa, so'm</label>
      <input id="summa-k" type="text" inputmode="numeric" autocomplete="off" placeholder="0" value="{{ summa }}" onChange="{{ summaOzgar }}" style="width: 100%; box-sizing: border-box; min-height: 60px; padding: 0 22px; border-radius: 30px; font: inherit; font-size: 26px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; color: #0B1530; background: linear-gradient(180deg, #FFFFFF, rgba(255,255,255,0.75)); border: 1px solid #C9D1DE; outline: none;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label for="nima-k" style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #4F607D;">Nima uchun</label>
      <input id="nima-k" type="text" autocomplete="off" placeholder="Masalan: lampochka sotib olindi" value="{{ nima }}" onChange="{{ nimaOzgar }}" style="width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 18px; border-radius: 23px; font: inherit; font-size: 15px; color: #0B1530; background: linear-gradient(180deg, #FFFFFF, rgba(255,255,255,0.75)); border: 1px solid #C9D1DE; outline: none;">
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{ tezlar }}" as="t" hint-placeholder-count="3">
          <button type="button" onClick="{{ t.tanla }}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 13.5px; font-weight: 600; color: #2E3D5C; cursor: pointer; background: linear-gradient(180deg, #FFFFFF, rgba(255,255,255,0.7)); border: 1px solid rgba(20,40,80,0.12);">{{ t.nomi }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span id="joy-l" style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #4F607D;">Pul qayerdan berildi</span>
      <div role="group" aria-labelledby="joy-l" style="display: flex; padding: 4px; gap: 4px; border-radius: 999px; background: rgba(20,40,80,0.08);">
        <sc-for list="{{ joylar }}" as="j" hint-placeholder-count="2">
          <button type="button" aria-pressed="{{ j.bosilgan }}" onClick="{{ j.tanla }}" style="{{ j.uslub }}">{{ j.nomi }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #E9F0FF; color: #1B3A8A; font-size: 13px; line-height: 1.45;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px;"><path d="M12 21a9 9 0 1 0 0-18a9 9 0 0 0 0 18z M12 11v5 M12 8h.01"></path></svg>
      <span>{{ tushuntirish }}</span>
    </div>

    <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding-top: 2px;">
      <a href="Main.dc.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 22px; box-sizing: border-box; border-radius: 999px; font-size: 14px; font-weight: 700; color: #0B1530; text-decoration: none; background: linear-gradient(180deg, #FFFFFF, rgba(255,255,255,0.7)); border: 1px solid rgba(20,40,80,0.12); box-shadow: 0 6px 18px rgba(28,54,110,0.10);">Bekor qilish</a>
      <a href="Main.dc.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 24px; box-sizing: border-box; border-radius: 999px; font-size: 14px; font-weight: 700; color: #FFFFFF; text-decoration: none; background: linear-gradient(180deg, #6A98FF 0%, #2F6BFF 55%, #1F55E6 100%); border: 1px solid rgba(255,255,255,0.55); box-shadow: 0 10px 24px rgba(47,107,255,0.32), inset 0 1px 0 rgba(255,255,255,0.55);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
        Saqlash
      </a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":840}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var joy = s.joy !== undefined ? s.joy : 0;
    var asos = "flex: 1; min-height: 44px; border: 0; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;";
    var faol = asos + " color: #0B1530; background: rgba(255,255,255,0.97); box-shadow: 0 2px 8px rgba(30,50,110,0.14), inset 0 1px 0 #FFFFFF;";
    var oddiy = asos + " color: #4F607D; background: transparent;";
    var joylar = ["Kassadan, naqd", "Depozit kartadan"].map(function (n, i) {
      return {
        nomi: n,
        bosilgan: i === joy ? "true" : "false",
        uslub: i === joy ? faol : oddiy,
        tanla: function () { self.setState({ joy: i }); }
      };
    });
    var tezlar = ["Boshliq naqd oldi", "Xo'jalik mollari", "Ta'mirlash"].map(function (n) {
      return { nomi: n, tanla: function () { self.setState({ nima: n }); } };
    });
    return {
      summa: s.summa !== undefined ? s.summa : "1 500 000",
      nima: s.nima !== undefined ? s.nima : "Boshliq naqd oldi",
      joylar: joylar,
      tezlar: tezlar,
      tushuntirish: joy === 0
        ? "Kassadan berilgan xarajat kassada bo'lishi kerak bo'lgan naqddan ayiriladi."
        : "Depozit kartadan berilgan xarajat depozit farqi bilan teng chiqadi, kassadagi naqdga ta'sir qilmaydi.",
      summaOzgar: function (e) { self.setState({ summa: e.target.value }); },
      nimaOzgar: function (e) { self.setState({ nima: e.target.value }); }
    };
  }
}
</script>
</body>
</html>
